name: ci
on:
  push:
jobs:
  build:
    permissions:
      contents: write
      id-token: write
    env:
      CI: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup
      - name: Format
        run: |
          treefmt --ci
      - name: Clippy
        run: |
          cargo clippy --all --lib --tests -- -D warnings
      - name: Test
        run: |
          cargo test
      - name: Build WebAssembly runtime
        run: |
          nix build .#webschembly-runtime --out-link result-runtime
          nix build .#webschembly-runtime-debug --out-link result-runtime-debug
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: result-runtime/lib/webschembly_runtime.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-debug
          path: result-runtime-debug/lib/webschembly_runtime.wasm
      - run: npm ci
      - run: npm run check
      - name: Build Playground
        run: |
          nix build .#webschembly-playground-for-pages --out-link result-playground
      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: result-playground
      - name: Build cli
        run: |
          nix build .#webschembly-compiler-cli --out-link result-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: result-cli-bin/bin/webschembly-compiler-cli
  e2e-test:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ["00", "01", "10", "11"]
    steps:
      - uses: actions/checkout@v3
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Install nodejs
        run: |
          nix profile install .#nodejs
      - uses: actions/download-artifact@v4
        with:
          name: runtime-debug
          path: ./result-runtime
      - run: npm ci
      - name: Run tests
        run: |
          WEBSCHEMBLY_RUNTIME=../result-runtime/webschembly_runtime.wasm npm test
        env:
          WEBSCHEMBLY_SHARD_PREFIX: ${{ matrix.shard }}
        working-directory: ./webschembly-js
  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4
        with:
          name: playground
          path: ./result-playground
      - name: Prepare pages
        run: |
          mkdir -p pages
          cp -r result-playground/* pages/
          git fetch --depth=1 origin github-action-benchmark-data
          git archive origin/github-action-benchmark-data | tar -x -C pages
      - name: Upload Playground
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages
      - uses: actions/deploy-pages@v4
        id: deployment
